## Run package-generated LANDIS-II scenario files through a natively
## installed LANDIS-II v8 console on a Windows runner -- the counterpart
## to `landis-integration.yaml` which uses Docker on Linux. Validates
## that the package's writers produce config files the v8 console
## accepts on Windows as well, and exercises the same
## `build_scenarios.R` fixtures end-to-end.
##
## When this workflow runs:
##   * `release` published                            (every release)
##   * `workflow_dispatch`                            (manual)
##   * commit subject contains `[ci-windows]`         (opt-in)
##
## The sentinel is matched against the *first line* of the commit
## message only, so documentation of the trigger elsewhere in the
## commit body does not accidentally fire the workflow.
##
## It does NOT run on every push because the Windows native install
## (Core MSI + ~28 Inno Setup extension installers) takes ~5-15 min.

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: landis-integration-windows.yaml

permissions: read-all

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          MSG_PUSH: ${{ github.event.head_commit.message }}
          MSG_PR: ${{ github.event.pull_request.title }}
        run: |
          should_run=false
          ## Match the trigger sentinel only against the SUBJECT line
          ## (first line of the commit message / PR title) so that
          ## documentation prose in the commit body cannot accidentally
          ## spawn the matrix.
          subject_push=$(printf '%s\n' "$MSG_PUSH" | head -n1)
          subject_pr=$(printf '%s\n' "$MSG_PR" | head -n1)
          case "$EVENT" in
            workflow_dispatch|release)
              should_run=true ;;
            push)
              [[ "$subject_push" == *"[ci-windows]"* ]] && should_run=true ;;
            pull_request)
              [[ "$subject_pr" == *"[ci-windows]"* ]] && should_run=true ;;
          esac
          echo "run=$should_run" >> "$GITHUB_OUTPUT"
          echo "Gate: event=$EVENT subject_push='$subject_push' subject_pr='$subject_pr' -> run=$should_run"

  landis-integration-windows:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest

    ## One leg per upstream extension LIST. The v8 collection ships UniversalCohorts v1 and v2 (and
    ## Succession v9 and v10) side by side, and an extension built against one cannot share a
    ## landscape with an extension built against the other, so the two sets cannot be installed on
    ## a single machine and still produce meaningful runs. fail-fast is off: a break in one leg says
    ## nothing about the other.
    ##
    ## `image:` names the YAML, NOT the artifact under test. Each leg installs the newest PUBLISHED
    ## Windows installer for every repo in its list, ignoring the `commit:` the YAML pins -- so
    ## neither leg reproduces the docker image it is named after (see the header of
    ## install_landis_windows.R). `extensions-v8-release.yaml` in particular is the UCLv1 source
    ## set, yet most of its repos now publish a v2 installer, so that leg installs a MIX. Which
    ## extensions are actually usable is therefore measured after installation, never assumed from
    ## the list's name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: uclv2
            yaml: extensions-v8-UCL2-release.yaml
          - image: release
            yaml: extensions-v8-release.yaml

    name: LANDIS-II v8 integration (Windows native, ${{ matrix.image }})

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANDIS_EXTENSIONS_YAML: ${{ matrix.yaml }}
      LANDIS_IMAGE_SET: ${{ matrix.image }}
      R_KEEP_PKG_SOURCE: yes
      DOTNET_VERSION: '8.0.x'

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::tibble
            any::gh
            any::cli
          dependencies: '"hard"'

      ## `R CMD INSTALL` tokenizes badly under PowerShell ("A positional
      ## parameter cannot be found that accepts argument 'INSTALL'.").
      ## Invoke R via -e instead.
      - name: Install landisutils
        run: |
          & R.exe -e "install.packages('.', repos = NULL, type = 'source', INSTALL_opts = c('--no-multiarch','--with-keep.source'))"
          if ($LASTEXITCODE -ne 0) { throw "R install exited $LASTEXITCODE" }

      - name: Cache LANDIS installers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\landis-installers
          key: landis-installers-${{ hashFiles('inst/integration-tests/_pins.R') }}

      - name: Install LANDIS-II native (MSI + Inno Setup extensions)
        env:
          LANDIS_DOWNLOAD_DIR: ${{ runner.temp }}\landis-installers
        run: |
          Rscript inst/integration-tests/install_landis_windows.R

      - name: Verify LANDIS-II install
        run: |
          if (-not $env:LANDIS_CONSOLE_DLL) {
            Write-Error "LANDIS_CONSOLE_DLL not set; install step failed to discover the console DLL."
            exit 1
          }
          Write-Host "LANDIS_CONSOLE_DLL = $env:LANDIS_CONSOLE_DLL"
          if (-not (Test-Path -LiteralPath $env:LANDIS_CONSOLE_DLL)) {
            Write-Error "LANDIS_CONSOLE_DLL points at a missing file."
            exit 1
          }
          dotnet --info

      - name: Build LANDIS-II scenarios
        id: build
        continue-on-error: true
        run: |
          $scen_root = Join-Path $env:RUNNER_TEMP "landis-scenarios"
          New-Item -ItemType Directory -Force -Path $scen_root | Out-Null
          $list = Join-Path $env:RUNNER_TEMP "landis-scenarios.list"
          Rscript inst/integration-tests/build_scenarios.R $scen_root > $list
          Write-Host "Scenarios built:"
          Get-Content $list

      - name: Run LANDIS-II on each scenario
        run: |
          ## This loop is meant to run every scenario and report all the failures at once, but it
          ## did not: GitHub sets $ErrorActionPreference = 'stop' for pwsh, and PowerShell 7.4+
          ## enables $PSNativeCommandUseErrorActionPreference by default, which promotes a non-zero
          ## exit from a NATIVE command (Rscript) to a terminating error. The first failing scenario
          ## therefore aborted the step, the remaining ones never ran, and the $fail accumulator was
          ## dead code. Observed: 1 failure reported out of 8 scenarios staged, 6 never attempted.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $list = Join-Path $env:RUNNER_TEMP "landis-scenarios.list"
          $failed = @()
          $skipped = @()
          $ran = 0
          foreach ($scen_path in (Get-Content $list)) {
            if (-not $scen_path) { continue }
            $scen_name = Split-Path -Leaf $scen_path

            ## Run every scenario built for THIS leg's image. `build_scenarios.R` emits both image
            ## variants in one invocation, so the suffix is the whole selection rule; a scenario
            ## with no `__<image>` suffix is image-agnostic and runs on both legs.
            ##
            ## There is deliberately no per-scenario exclusion list here any more. The previous one
            ## named scenarios that mix cohort-library generations and abort with
            ##   The data type of site variable "Succession.UniversalCohorts" is
            ##   Landis.Library.UniversalCohorts.SiteCohorts, not ...SiteCohorts
            ## (the same type from two different assemblies). It went stale in both directions: it
            ## blamed SCRAPPLE, which binds v2 and runs to completion, and the release leg's
            ## allowlist had narrowed to two scenarios, silently dropping several that do work.
            ## The install step now MEASURES which generation each installed extension binds and
            ## exports the offenders as LANDIS_EXCLUDE_EXTENSIONS, so an unrunnable extension is
            ## dropped from the scenario that would have contained it and the scenario either runs
            ## without it or is skipped at build time for want of a succession backend.
            $suffix = "__" + $env:LANDIS_IMAGE_SET
            $want = ($scen_name -notlike "*__*") -or ($scen_name -like "*$suffix")
            if (-not $want) {
              Write-Host "skip (belongs to the other extension generation): $scen_name"
              $skipped += $scen_name
              continue
            }
            Write-Host "::group::LANDIS-II run: $scen_name"
            Rscript inst/integration-tests/run_native.R $scen_path
            $ran++
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::LANDIS-II run failed for scenario '$scen_name' (exit $LASTEXITCODE)"
              $failed += $scen_name
            }
            Write-Host "::endgroup::"
          }
          Write-Host "Ran $ran scenario(s); $($failed.Count) failed; $($skipped.Count) skipped."
          if ($skipped.Count -gt 0) {
            Write-Host "Skipped: $($skipped -join ', ')"
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::LANDIS-II failed for $($failed.Count)/$ran scenario(s): $($failed -join ', ')"
            exit 1
          }
          exit 0

      - name: Upload scenario directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landis-scenarios-windows-${{ matrix.image }}
          path: ${{ runner.temp }}/landis-scenarios
          retention-days: 7
          if-no-files-found: ignore

      ## The installer writes msiexec/Inno Setup verbose logs beside the downloads. Without this,
      ## an install failure discards the only thing that explains it: the run that prompted this
      ## step died on `msiexec exit 1619` with the log sitting unread on the runner, and the
      ## scenarios directory -- the sole artifact -- did not exist because the build step had been
      ## skipped, so the job produced no artifacts at all. Logs only, not the ~30 MB of installers.
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landis-installer-logs-windows-${{ matrix.image }}
          path: ${{ runner.temp }}/landis-installers/*.log
          retention-days: 7
          if-no-files-found: ignore

      ## Placed AFTER the run steps on purpose. build_scenarios.R exits non-zero when a scenario
      ## fails to build, which is what makes a silent loss of coverage visible -- but if the build
      ## step itself fails, every later step is skipped and the scenarios that DID build never run.
      ## `continue-on-error` on the build step keeps them running; this gate then fails the job, so
      ## one run reports both what still works and what stopped building.
      - name: Fail if any scenario failed to build
        if: always() && steps.build.outcome == 'failure'
        run: |
          echo "::error::one or more scenarios failed to build; see the 'Build LANDIS-II scenarios' step"
          exit 1
