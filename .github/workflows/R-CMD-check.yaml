# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Two deliberate departures from that example, both marked below:
#   * `development` is a checked branch. Work lands there first and reaches `main` by pull request,
#     so without it a push to `development` ran nothing at all and the first check of a change was
#     the pull request that proposed merging it.
#   * a concurrency group, because the branch above takes many small pushes and each one would
#     otherwise queue a fresh five-platform matrix while the previous one was still running.
on:
  push:
    branches: [main, master, development]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

concurrency:
  # One run per ref. A pull request and a push to its source branch are separate refs, so a branch
  # with an open pull request still gets both -- that is the cost of checking the branch itself.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled everywhere EXCEPT `main`, where each commit should keep its own
  # finished result: a cancelled run there reads as a failure in the history rather than as a
  # newer push having overtaken it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
